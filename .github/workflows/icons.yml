# Скачивает иконки всех ресурсов из names.js с официального сервера иконок Albion
# и кладёт их в images/items/, чтобы сайт показывал свои копии, а не тянул их с чужого сервера.
# Запускается сам, когда меняется names.js или этот файл, и вручную: Actions → «Иконки предметов» → Run workflow.
name: Иконки предметов
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [names.js, .github/workflows/icons.yml]
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать недостающие иконки
        run: |
          pip install --quiet pillow
          mkdir -p images/items /tmp/png
          ok=0; miss=0
          for id in $(grep -oE '"T[0-9]_[A-Z]+(_LEVEL[0-9]@[0-9])?"' names.js | tr -d '"' | sort -u); do
            name="${id//@/_}"
            [ -s "images/items/$name.webp" ] && continue
            if curl -fsSL --retry 3 --retry-delay 2 "https://render.albiononline.com/v1/item/${id//@/%40}.png?size=128&quality=1" -o "/tmp/png/$name.png"; then
              ok=$((ok+1))
            else
              echo "Не скачалась: $id"; miss=$((miss+1))
            fi
            sleep 0.2
          done
          # PNG по 30 КБ → WebP по 5 КБ: страница грузится быстрее
          python3 -c "
          import glob, os
          from PIL import Image
          for f in glob.glob('/tmp/png/*.png'):
              Image.open(f).convert('RGBA').save('images/items/' + os.path.basename(f)[:-4] + '.webp', 'WEBP', quality=85, method=6)
          "
          echo "Скачано: $ok, не скачалось: $miss, всего в папке: $(ls images/items | wc -l)"
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add images/items
          if git diff --cached --quiet; then echo "Новых иконок нет"; else git commit -m "Иконки предметов" && git push; fi
